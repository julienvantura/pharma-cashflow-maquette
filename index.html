<!doctype html>
<html lang="fr">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pharma Cashflow</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2048%2048%22%20role%3D%22img%22%20aria-label%3D%22Pharma%20Cashflow%22%3E%20%20%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%221%22%20x2%3D%221%22%20y2%3D%220%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%232457F5%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%2314B8D4%22/%3E%3C/linearGradient%3E%3C/defs%3E%20%20%3Crect%20x%3D%2217%22%20y%3D%224%22%20width%3D%2214%22%20height%3D%2240%22%20rx%3D%224%22%20fill%3D%22url%28%23g%29%22/%3E%20%20%3Crect%20x%3D%224%22%20y%3D%2217%22%20width%3D%2216%22%20height%3D%2214%22%20rx%3D%224%22%20fill%3D%22url%28%23g%29%22/%3E%20%20%3Crect%20x%3D%2232.5%22%20y%3D%2223%22%20width%3D%225%22%20height%3D%228%22%20rx%3D%221.6%22%20fill%3D%22%2314B8D4%22/%3E%20%20%3Crect%20x%3D%2239%22%20y%3D%2216%22%20width%3D%225%22%20height%3D%2215%22%20rx%3D%221.6%22%20fill%3D%22%2314B8D4%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --night:#0B1630; --night-2:#12204A; --night-line:#22325F; --night-ink:#C9D3F0; --night-mute:#9DAAD3;
  --electric:#2457F5; --electric-ink:#1A44CC; --electric-soft:#E8EEFF;
  --cyan:#14B8D4; --cyan-ink:#0A7E93; --cyan-soft:#E2F7FB;
  --bg:#F3F5FA; --surface:#FFFFFF; --surface-2:#F8F9FC; --line:#E1E5EF; --ink:#0E1630; --ink-2:#3A4566; --mute:#5E6886;
  --good:#12805A; --good-soft:#E3F4EC; --warn:#A86A08; --warn-soft:#FBF0DA; --bad:#C23A2B; --bad-soft:#FBE8E5;
  --dormant:#9AA6C6;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px -14px rgba(0,0,0,.12);
  --r:12px;
}
:root[data-theme="dark"]{
  --bg:#081025; --surface:#0F1A38; --surface-2:#13204A; --line:#22325F; --ink:#E8EDFB; --ink-2:#BAC4E2; --mute:#8D99BF;
  --electric:#5C83FF; --electric-ink:#8EA9FF; --electric-soft:#16245A;
  --cyan:#3FD3EC; --cyan-ink:#6BE0F3; --cyan-soft:#0D3341;
  --good:#4CC28F; --good-soft:#0F3328; --warn:#E3A94A; --warn-soft:#382A12; --bad:#F07A69; --bad-soft:#3A1C1A;
  --dormant:#4B5A86; --night:#050B1C; --night-2:#0B1630;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:Onest,system-ui,sans-serif;font-size:14px;line-height:1.5;font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased}
::selection{background:var(--cyan);color:#04121A}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px}
svg.lucide{width:16px;height:16px;stroke-width:1.75;flex:none}
.num{font-variant-numeric:tabular-nums}

/* ---------- top bar : role switch ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--night);color:var(--night-ink);border-bottom:1px solid var(--night-line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.02em;color:#fff;margin-right:8px}
.brand-mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--electric),var(--cyan));display:grid;place-items:center}
.brand-mark svg{color:#fff;width:16px;height:16px}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--night-mute);letter-spacing:0}
.roles{display:flex;gap:4px;padding:4px;background:var(--night-2);border:1px solid var(--night-line);border-radius:10px}
.role{display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--night-mute);padding:6px 12px;border-radius:7px;transition:background .18s,color .18s}
.role:hover{color:#fff}
.role[aria-pressed="true"]{background:#fff;color:var(--night)}
:root[data-theme="dark"] .role[aria-pressed="true"]{background:var(--electric);color:#fff}
.role .who{font-weight:600}.role .what{font-size:12px;opacity:.9}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.fake{font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid var(--night-line);color:var(--night-mute)}
.icon-btn{border:1px solid var(--night-line);background:var(--night-2);color:var(--night-ink);width:32px;height:32px;border-radius:8px;display:grid;place-items:center}
.icon-btn:hover{color:#fff;border-color:var(--night-mute)}

/* ---------- app shell ---------- */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:calc(100vh - 53px)}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:2px}
.side .ctx{padding:8px 10px 14px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.side .ctx b{display:block;font-size:14px}.side .ctx span{color:var(--mute);font-size:12px}
.nav{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;color:var(--ink-2);width:100%;transition:background .15s}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav[aria-current="page"]{background:var(--electric-soft);color:var(--electric-ink);font-weight:600}
.nav .count{margin-left:auto;font-size:11px;font-weight:600;background:var(--warn-soft);color:var(--warn);padding:1px 7px;border-radius:99px}
.side .foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);color:var(--mute);font-size:12px;display:flex;gap:8px;align-items:center}
main{padding:36px 48px 72px;max-width:1200px;width:100%;min-width:0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px}
h1{font-size:28px;line-height:1.15;font-weight:650;letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance}
h2{font-size:15px;font-weight:600;margin:0}
.sub{color:var(--mute);margin:0}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;font-weight:550;transition:border-color .15s,background .15s,transform .1s}
.btn:hover{border-color:var(--mute)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--electric);border-color:var(--electric);color:#fff}
.btn.primary:hover{background:var(--electric-ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--electric-ink)}
.btn.ghost:hover{background:var(--electric-soft)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:550;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.info{background:var(--cyan-soft);color:var(--cyan-ink)}.pill.neutral{background:var(--surface-2);color:var(--mute);border:1px solid var(--line)}
.pill svg{width:13px;height:13px}
.est{font-size:11px;color:var(--mute);border-bottom:1px dashed var(--mute);cursor:help}

/* ---------- money statement (signature) ---------- */
.statement{padding:26px 28px 24px;display:grid;grid-template-columns:1.25fr 1fr;gap:32px;align-items:center}
.statement p.lead{font-size:24px;line-height:1.35;letter-spacing:-.01em;margin:0 0 6px;font-weight:500;text-wrap:pretty}
.statement p.lead strong{font-weight:700;color:var(--electric-ink)}
.stockbar{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--surface-2);margin:18px 0 10px}
.stockbar span{display:block;height:100%;transition:width .6s cubic-bezier(.16,1,.3,1)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:0}
.legend b{font-weight:600;color:var(--ink)}
.recup{border-left:1px solid var(--line);padding-left:28px;display:grid;gap:14px}
.recup .row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.recup .row span{color:var(--ink-2)}
.recup .row b{font-size:17px;font-weight:650}
.recup .row b.up{color:var(--good)}

/* ---------- priorities ---------- */
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;margin-top:20px;align-items:start}
.prio{list-style:none;margin:0;padding:6px 0}
.prio li{display:grid;grid-template-columns:36px 1fr auto;gap:14px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);transition:background .15s}
.prio li:last-child{border-bottom:0}
.prio li:hover{background:var(--surface-2)}
.prio .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.prio .ico.money{background:var(--electric-soft);color:var(--electric-ink)}
.prio .ico.time{background:var(--warn-soft);color:var(--warn)}
.prio .ico.risk{background:var(--bad-soft);color:var(--bad)}
.prio .ico.ok{background:var(--good-soft);color:var(--good)}
.prio .t{font-weight:600}.prio .d{color:var(--mute);font-size:13px}
.prio .amount{text-align:right;font-weight:650}
.prio .amount small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.prio li.done{opacity:.5}
.prio li.done .t{text-decoration:line-through}

/* ---------- copilot ---------- */
.copilot{display:flex;flex-direction:column;max-height:520px}
.chat{padding:16px 18px;display:flex;flex-direction:column;gap:12px;overflow:auto;flex:1}
.msg{max-width:92%;padding:10px 13px;border-radius:12px;font-size:13.5px}
.msg.me{align-self:flex-end;background:var(--electric);color:#fff;border-bottom-right-radius:4px}
.msg.ai{background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.ai ol{margin:6px 0 6px;padding-left:18px}
.msg.ai .src{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.suggest{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px 10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:12.5px;color:var(--ink-2)}
.chip:hover{border-color:var(--electric);color:var(--electric-ink)}
.ask{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.ask input{flex:1;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:9px;padding:9px 12px;font:inherit}
.ask input::placeholder{color:var(--mute)}
.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--mute);margin-right:3px;animation:b 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:550;color:var(--mute);text-align:left;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--surface-2)}
td{padding:13px 20px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .15s}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:var(--surface-2)}
td.r,th.r{text-align:right}
td .muted{color:var(--mute);font-size:12.5px;display:block}
.health{display:inline-flex;align-items:center;gap:8px}
.health .bar{width:64px;height:6px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.health .bar span{display:block;height:100%;border-radius:99px}

/* ---------- simulator ---------- */
.sim{padding:22px 24px;display:grid;grid-template-columns:1fr 1fr;gap:30px}
.slider-row{margin:18px 0}
.slider-row label{display:flex;justify-content:space-between;font-weight:550;margin-bottom:8px}
input[type=range]{width:100%;accent-color:var(--electric)}
.sim-out{background:var(--night);color:#fff;border-radius:12px;padding:22px 24px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.sim-out .big{font-size:36px;font-weight:700;letter-spacing:-.02em;color:#fff}
.sim-out .big em{font-style:normal;color:var(--cyan)}
.sim-out p{margin:0;color:var(--night-ink)}
.sim-out .hyp{margin-top:12px;font-size:12px;color:var(--night-mute);border-top:1px solid var(--night-line);padding-top:12px}

/* ---------- read-only banner ---------- */
.viewas{display:flex;align-items:center;gap:10px;background:var(--cyan-soft);color:var(--cyan-ink);border:1px solid color-mix(in srgb,var(--cyan) 30%,transparent);padding:9px 14px;border-radius:10px;margin-bottom:18px;font-weight:550}
.viewas .btn{margin-left:auto;padding:5px 10px;font-size:13px}

/* ---------- préparateur : phone ---------- */
.stage{display:grid;grid-template-columns:auto 1fr;gap:56px;align-items:center;justify-content:center;padding:36px 40px 60px;max-width:1180px;margin:0 auto}
.phone{width:390px;height:812px;border-radius:52px;background:#030714;padding:12px;box-shadow:0 30px 60px -30px rgba(0,0,0,.45),0 0 0 1px #1d2a50 inset}
.screen{width:100%;height:100%;border-radius:42px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;position:relative}
.status{display:flex;justify-content:space-between;padding:14px 28px 6px;font-size:13px;font-weight:600}
.m-head{padding:8px 20px 14px}
.m-head h1{font-size:22px}
.m-body{flex:1;overflow:auto;padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.m-tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding:8px 8px 22px}
.m-tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mute);padding:6px}
.m-tab svg{width:21px;height:21px}
.m-tab[aria-current="page"]{color:var(--electric-ink);font-weight:600}
.task{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.task .n{font-weight:600}.task .w{color:var(--mute);font-size:12.5px}
.task .go{grid-row:span 2;width:40px;height:40px;border-radius:12px;border:0;background:var(--electric);color:#fff;display:grid;place-items:center}
.task.done{opacity:.55}.task.done .go{background:var(--good)}
.progress-line{font-size:12.5px;color:var(--mute);display:flex;justify-content:space-between;padding:2px 4px}
.track{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:0 4px 6px}
.track span{display:block;height:100%;background:var(--cyan);transition:width .4s cubic-bezier(.16,1,.3,1)}
.viewfinder{margin:4px 0;height:300px;border-radius:18px;background:radial-gradient(120% 90% at 50% 40%,#1b2a55,#060c1e);position:relative;overflow:hidden;display:grid;place-items:center}
.viewfinder .frame{width:240px;height:120px;border-radius:14px;position:relative}
.viewfinder .frame::before,.viewfinder .frame::after{content:"";position:absolute;inset:0;border-radius:14px;border:2px solid var(--cyan);clip-path:polygon(0 0,22% 0,22% 4%,4% 4%,4% 30%,0 30%,0 70%,4% 70%,4% 96%,22% 96%,22% 100%,0 100%)}
.viewfinder .frame::after{transform:scaleX(-1)}
.viewfinder .laser{position:absolute;left:12%;right:12%;height:2px;background:var(--cyan);top:50%;animation:scan 1.8s ease-in-out infinite alternate}
@keyframes scan{from{transform:translateY(-44px)}to{transform:translateY(44px)}}
.viewfinder .hint{position:absolute;bottom:14px;color:#C9D3F0;font-size:12.5px}
.counter{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.counter .prod{font-weight:650;font-size:16px}
.counter .meta{color:var(--mute);font-size:12.5px;margin-bottom:12px}
.stepper{display:grid;grid-template-columns:56px 1fr 56px;gap:10px;align-items:center}
.stepper button{height:56px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center}
.stepper button svg{width:22px;height:22px}
.stepper output{text-align:center;font-size:34px;font-weight:700}
.compare{display:flex;justify-content:space-between;font-size:13px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.m-cta{width:100%;height:52px;border-radius:14px;border:0;background:var(--electric);color:#fff;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.aside-note h2{font-size:28px;font-weight:650;letter-spacing:-.02em;line-height:1.15;margin:0 0 12px;max-width:16ch}
.aside-note p{color:var(--ink-2);max-width:46ch;font-size:15px}
.aside-note ul{padding:0;list-style:none;margin:22px 0 0;display:grid;gap:12px}
.aside-note li{display:flex;gap:10px;color:var(--ink-2)}
.aside-note li svg{color:var(--cyan-ink);margin-top:3px}
.toast{position:absolute;left:16px;right:16px;bottom:96px;background:var(--night);color:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;transform:translateY(20px);opacity:0;transition:.25s cubic-bezier(.16,1,.3,1);pointer-events:none}
.toast.show{transform:none;opacity:1}
.toast svg{color:var(--cyan)}


.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:0 12px;color:var(--mute)}
.search input{border:0;background:none;color:var(--ink);font:inherit;padding:9px 0;width:220px;outline:none}
.seg{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;width:max-content;max-width:100%;overflow-x:auto}
.seg button{display:flex;align-items:center;gap:7px;border:0;background:none;padding:7px 12px;border-radius:8px;color:var(--ink-2);white-space:nowrap}
.seg button span{font-size:11px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:0 7px}
.seg button[aria-selected="true"]{background:var(--electric-soft);color:var(--electric-ink);font-weight:600}
.delay{position:relative;height:16px;margin-bottom:4px}
.delay span{position:absolute;left:0;height:6px;border-radius:99px}
.delay .a{top:0;background:var(--line)}
.delay .b{top:9px}.delay .b.good{background:var(--good)}.delay .b.warn{background:var(--warn)}.delay .b.bad{background:var(--bad)}
.dot-legend{display:inline-block;width:14px;height:4px;border-radius:9px;vertical-align:middle}.dot-legend.a{background:var(--line)}.dot-legend.b{background:var(--good)}
.ico-sq{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--cyan-soft);color:var(--cyan-ink);flex:none}
.report{padding:20px;background:var(--surface-2)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:24px 26px;box-shadow:var(--shadow)}
.sheet-top{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.08em;color:var(--mute);padding-bottom:10px;border-bottom:2px solid var(--night)}
:root[data-theme="dark"] .sheet-top{border-color:var(--electric)}
.sheet-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:16px}
.sheet-grid div{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column}
.sheet-grid span{font-size:12px;color:var(--mute)}.sheet-grid b{font-size:18px}.sheet-grid small{font-size:12px;color:var(--good)}
.files{list-style:none;margin:0;padding:0}
.files li{display:grid;grid-template-columns:20px 1fr auto;gap:12px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line)}
.files li:last-child{border-bottom:0}.files li span{display:block;color:var(--mute);font-size:12.5px}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.plan{padding:20px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}

<script>
const eur = n => n.toLocaleString('fr-FR',{maximumFractionDigits:0})+' €';
const PHARMAS = [
  {id:'port',  name:'Pharmacie du Port',      city:'Le Port',        lgo:'Winpharma', plan:'Performance', since:'Pilote',    imp:'il y a 2 h',   stock:184200, dormant:23480, slow:31200, recup:4870, health:72, users:4, status:'good'},
  {id:'tampon',name:'Pharmacie des Hauts',    city:'Le Tampon',      lgo:'LGPI',      plan:'Essentielle', since:'Pilote',    imp:'hier',         stock:142900, dormant:15100, slow:22400, recup:2310, health:78, users:3, status:'good'},
  {id:'stpaul',name:'Pharmacie de la Baie',   city:'Saint-Paul',     lgo:'Smart Rx',  plan:'Performance', since:'Pilote',    imp:'il y a 6 j',   stock:221500, dormant:38900, slow:40100, recup:1290, health:58, users:2, status:'warn'},
  {id:'stdenis',name:'Pharmacie Barachois',   city:'Saint-Denis',    lgo:'Winpharma', plan:'Intelligence',since:'Pilote',    imp:'il y a 3 h',   stock:265300, dormant:29700, slow:35800, recup:6420, health:69, users:6, status:'good'},
  {id:'stpierre',name:'Pharmacie du Front de mer',city:'Saint-Pierre',lgo:'à confirmer',plan:'Essentielle',since:'Pilote', imp:'aucun import', stock:0, dormant:0, slow:0, recup:0, health:0, users:1, status:'bad'},
];
const state = {role:'pharmacien', page:'aujourdhui', pharma:'port', fromSylvain:false, done:new Set(), prepTab:'taches', count:4, tasks:[false,false,false,false,false], added:new Set(), relance:new Set(), ecart:null, imp:null};

function rolePharma(){ return PHARMAS.find(p=>p.id===state.pharma); }

/* ================= SYLVAIN ================= */
function sylvainNav(){
  return sideNav('Réseau Pharma Cashflow',`${PHARMAS.length} pharmacies · La Réunion`,[
    ['§','Réseau','network'],['reseau','network','Mon réseau',null,null,'accueil pharmacies'],['comparaison','chart-no-axes-column','Comparaison',null,null,'benchmark anonyme'],
    ['§','Pharmacies','building-2'],['nouvelle','plus','Nouvelle pharmacie',null,null,'ajouter creer installation assistant'],['imports','upload','Imports',1,null,'fichiers export donnees'],['merchreseau','layout-grid','Merchandising',2,null,'rayons gondoles modeles implantation'],
    ['§','Commercial','receipt'],['abonnements','receipt','Abonnements',null,null,'facturation formules revenu'],
    ['§','Réglages','settings'],['parametres','settings','Paramètres',null,null,'compte']
  ]);
}
function sylvainReseau(){
  const active = PHARMAS.filter(p=>p.stock);
  const recup = active.reduce((s,p)=>s+p.recup,0), dorm = active.reduce((s,p)=>s+p.dormant,0);
  const mrr = {Essentielle:99,Performance:179,Intelligence:249};
  const rev = PHARMAS.reduce((s,p)=>s+mrr[p.plan],0);
  return `<div class="view">
  <div class="page-head"><div><h1>Bonjour Sylvain</h1><p class="sub">Vos ${PHARMAS.length} pharmacies, au 23 novembre 2026.</p></div>
  <button class="btn primary" data-page="nouvelle"><i data-lucide="plus"></i>Ajouter une pharmacie</button></div>

  <section class="panel statement hero">
    <div>
      <p class="lead">Depuis le début du pilote, Pharma Cashflow a fait récupérer <strong data-count="${recup}">${eur(recup)}</strong> à vos pharmacies, et repéré <strong data-count="${dorm}">${eur(dorm)}</strong> de stock qui dort.</p>
      <p class="sub">C'est votre meilleur argument de vente : chaque pharmacie voit le détail de ses propres euros.</p>
    </div>
    <div class="recup">
      <div class="row"><span>Revenu mensuel prévu</span><b class="num">${eur(rev)}</b></div>
      <div class="row"><span>Pharmacies actives cette semaine</span><b class="num">3 sur 5</b></div>
      <div class="row"><span>À relancer</span><b class="num" style="color:var(--warn)">2</b></div>
    </div>
  </section>

  <section class="panel" style="margin-top:20px">
    <div class="panel-head"><h2>Pharmacies</h2><span class="sub" style="font-size:13px">Cliquez une ligne pour voir la pharmacie comme son titulaire</span></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Pharmacie</th><th>Formule</th><th>Dernier import</th><th>Santé du stock</th><th class="r">Récupéré</th><th class="r">Stock qui dort</th><th></th></tr></thead>
      <tbody>${PHARMAS.map(p=>`
        <tr class="clickable" data-open="${p.id}" tabindex="0">
          <td><b>${p.name}</b><span class="muted">${p.city} · ${p.lgo}</span></td>
          <td>${p.plan}<span class="muted">${mrr[p.plan]} € / mois</span></td>
          <td>${p.status==='bad'?'<span class="pill bad"><i data-lucide="circle-alert"></i>Aucun import</span>':p.status==='warn'?`<span class="pill warn"><i data-lucide="clock"></i>${p.imp}</span>`:`<span class="pill good"><i data-lucide="check"></i>${p.imp}</span>`}</td>
          <td>${p.health?healthBar(p.health):'<span class="muted">En attente des données</span>'}</td>
          <td class="r num">${p.recup?`<b style="color:var(--good)">${eur(p.recup)}</b>`:'<span class="muted">-</span>'}</td>
          <td class="r num">${p.dormant?eur(p.dormant):'<span class="muted">-</span>'}</td>
          <td class="r"><i data-lucide="chevron-right" style="color:var(--mute)"></i></td>
        </tr>`).join('')}</tbody>
    </table></div>
  </section>

  <div class="grid2">
    <section class="panel">
      <div class="panel-head"><h2>À faire pour votre réseau</h2></div>
      <ul class="prio">

const SHAPES={rect:[[0,0],[1,0],[1,1],[0,1]],L:[[0,0],[.62,0],[.62,.45],[1,.45],[1,1],[0,1]],trap:[[.12,0],[.88,0],[1,1],[0,1]],T:[[.3,0],[.7,0],[.7,.4],[1,.4],[1,1],[0,1],[0,.4],[.3,.4]],pan:[[0,0],[.75,0],[1,.3],[1,1],[0,1]]};
function normRoom(P){

const FTYPES={tete:['Tête de gondole',60,40,1.4],vitrine:['Vitrine',100,60,1.8],presentoir:['Présentoir rond',60,60,1.5],bac:['Bac promo',80,60,.7],conf:['Espace confidentiel',150,150,2],caisse:['Poste de comptoir',150,70,1]};

  if(t.dataset.open){state.twinHl=null;state.twFocus=null;state.pharma=t.dataset.open;state.fromSylvain=true;state.merchEdit=false;state.page='aujourdhui';return render();}
  if(t.hasAttribute('data-back')){state.page=state.merchEdit?'merchreseau':'reseau';state.fromSylvain=false;state.merchEdit=false;return render();}
  if(t.dataset.gomerch){state.pharma=t.dataset.gomerch;state.fromSylvain=true;state.merchEdit=true;state.mg=null;state.page='merch';return render();}
  if(t.dataset.gtoast){gtoast(t.dataset.gtoast);return;}
  if(t.dataset.done){state.done.has(t.dataset.done)?state.done.delete(t.dataset.done):state.done.add(t.dataset.done);return render();}
  if(t.dataset.q){ask(+t.dataset.q,ANSWERS[+t.dataset.q].q);t.remove();return;}
  if(t.dataset.ptab){state.prepTab=t.dataset.ptab;return render();}
  if(t.dataset.task){const i=+t.dataset.task;if(!state.tasks[i]&&TASKS[i][0].startsWith('Compter')){state.prepTab='scan';state.cur=i;return render();}state.tasks[i]=!state.tasks[i];return render();}
  if(t.dataset.step){state.count=Math.max(0,state.count+ +t.dataset.step);document.getElementById('cnt').textContent=state.count;document.getElementById('valider').innerHTML=`<i data-lucide="check"></i>Valider ${state.count} unités`;lucide.createIcons();return;}
  if(t.id==='valider'){if(state.off)state.pending=(state.pending||0)+1;const i=state.cur??0;state.tasks[i]=true;const ecart=state.count-7;if(ecart)state.ecart={n:TASKS[i][0].replace('Compter : ',''),c:state.count};state.prepTab='taches';render();toast(ecart?`Écart de ${ecart} envoyé au Dr Payet`:'Comptage conforme, merci');return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.hasAttribute?.('data-navq')){const b=[...e.target.closest('.side').querySelectorAll('.nav')].find(x=>!x.hidden);if(b){e.preventDefault();b.click();}return;}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette();return;}
 if(document.getElementById('palette').classList.contains('on')){const r=paletteItems(document.getElementById('palq').value);if(e.key==='ArrowDown'){e.preventDefault();state.palSel=Math.min(r.length-1,(state.palSel||0)+1);drawPalette();return;}if(e.key==='ArrowUp'){e.preventDefault();state.palSel=Math.max(0,(state.palSel||0)-1);drawPalette();return;}if(e.key==='Enter'&&r[state.palSel||0]){e.preventDefault();const x=r[state.palSel||0];pickPalette(x.t+'|'+x.k);return;}if(e.key==='Escape'){closePalette();return;}}
 if(e.key==='Escape')closeDrawer();if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.open){e.target.click();}});
document.addEventListener('change',e=>{const el=e.target;if(!el.dataset)return;
  if(el.hasAttribute('data-sgfile')&&el.files[0]){const fr=new FileReader();fr.onload=()=>{state.sg.photo=fr.result;render();};fr.readAsDataURL(el.files[0]);return;}
  if(el.hasAttribute('data-mgbase')||el.hasAttribute('data-mgsuf')){const M=mgState(),g=M.gonds[M.gi],v=el.value.trim()||(el.hasAttribute('data-mgbase')?gBase(g):gSuf(g));g.name=el.hasAttribute('data-mgbase')?v+' · '+gSuf(g):gBase(g)+' · '+v;return render();}
  if(el.hasAttribute('data-phfile')&&el.files[0]){const fr=new FileReader();fr.onload=()=>phStart(fr.result);fr.readAsDataURL(el.files[0]);return;}
  if(el.dataset.mgh){const M=mgState();M.gonds[M.gi].sh[+el.dataset.mgh].h=Math.max(15,Math.min(60,+el.value||32));return render();}
  if(el.dataset.nf&&el.tagName==='SELECT'){state.nf[el.dataset.nf]=el.value;if(el.dataset.nf==='lgo')render();return;}
  if(el.dataset.nfg){const [i,k]=el.dataset.nfg.split('|');state.nf.gonds[+i][k]=k==='rayon'||k==='mod'?el.value:+el.value;return render();}
  if(el.dataset.gen){state.gen[el.dataset.gen]=+el.value;return render();}
  if(el.hasAttribute('data-fprotv')){rotateSel(el.dataset.ctx,+el.value||0,null);clampAll(fpTarget(el.dataset.ctx));return render();}
  if(el.dataset.fpgw){const P=fpTarget(el.dataset.ctx),i=+el.dataset.fpgw;P.gonds[i].w=+el.value;if(el.dataset.ctx==='store')state.mg=null;if(P.gonds[i].kind==='mural')wallSnap(normRoom(P),i);else clampAll(P);return render();}
  if(el.dataset.fpw||el.dataset.fpd){const P=fpTarget(el.dataset.ctx),f=P.furn[+(el.dataset.fpw||el.dataset.fpd)];f[el.dataset.fpw?'w':'d']=Math.max(30,+el.value||60);clampAll(P);return render();}
  if(el.dataset.fpwl){const P=normRoom(fpTarget(el.dataset.ctx)),V=P.room.poly,i=+el.dataset.fpwl,A=V[i],B=V[(i+1)%V.length],L=wallLen(A,B)||1,nl=Math.max(.5,+el.value||L);V[(i+1)%V.length]=[+(A[0]+(B[0]-A[0])/L*nl).toFixed(2),+(A[1]+(B[1]-A[1])/L*nl).toFixed(2)];P.room.w=Math.max(P.room.w,Math.ceil(Math.max(...V.map(v=>v[0])))) ;P.room.d=Math.max(P.room.d,Math.ceil(Math.max(...V.map(v=>v[1]))));const n=nearestWall(P,P.door.x,P.door.z);P.door={x:n.x,z:n.z,a:n.a};clampAll(P);return render();}
  if(el.dataset.room){const P=normRoom(fpTarget(el.dataset.ctx)),k=el.dataset.room,old=P.room[k],v=Math.max(+el.min,Math.min(+el.max,+el.value||old)),f=v/old,j=k==='w'?0:1;P.room[k]=v;P.room.poly.forEach(q=>{q[j]=+(q[j]*f).toFixed(1);});P.pos.forEach(q=>{if(j)q.z=+(q.z*f).toFixed(1);else q.x=+(q.x*f).toFixed(1);});if(j)P.counter.z=+(P.counter.z*f).toFixed(1);else P.counter.x=+(P.counter.x*f).toFixed(1);const n=nearestWall(P,P.door.x*(j?1:f),P.door.z*(j?f:1));P.door={x:n.x,z:n.z,a:n.a};clampAll(P);return render();}
});
document.addEventListener('input',e=>{if(e.target.hasAttribute?.('data-navq')){const q=normTxt(e.target.value.trim()),side=e.target.closest('.side');side.querySelectorAll('.nav').forEach(b=>b.hidden=!!q&&!b.dataset.kw.includes(q));side.querySelectorAll('.ngrp').forEach(g=>{const any=[...g.querySelectorAll('.nav')].some(b=>!b.hidden);g.hidden=!!q&&!any;g.classList.toggle('qopen',!!q&&any);});return;}
  if(e.target.hasAttribute?.('data-sgnote')){state.sg.note=e.target.value;return;}
  if(e.target.hasAttribute?.('data-twq')){state.twq=e.target.value;state.twqOpen=true;const L=document.querySelector('.whres');if(L){L.innerHTML=whereList(storeOf(state.pharma),state.twq);lucide.createIcons();}return;}
  if(e.target.hasAttribute?.('data-pq')){state.pq=e.target.value;if(state.pfind){state.pfind=null;document.querySelector('.mloc')?.remove();}const L=document.querySelector('.pres');if(L){L.innerHTML=presList();lucide.createIcons();}return;}
  if(e.target.hasAttribute?.('data-mgq')){state.mgq=e.target.value;const L=document.querySelector('.catal-l');if(L){L.innerHTML=catalogue(state.mgq).map(c=>`<button class="cprod ${c.p}" draggable="true" data-mgadd="${c.n.replace(/"/g,'&quot;')}" title="${c.n} · ${c.w} cm"><span>${c.n}</span><small>${c.w} cm · ${c.st} en stock</small></button>`).join('')||'<span class="sub">Aucun produit</span>';}return;}
  if(e.target.dataset?.nf&&e.target.tagName==='INPUT'){state.nf[e.target.dataset.nf]=e.target.value;const b=document.querySelector('.nfnav .btn.primary');if(b&&state.nf.step===0)b.disabled=e.target.dataset.nf==='name'?e.target.value.trim().length<3:b.disabled;const s1=document.querySelector('.nfsteps');if(s1&&e.target.dataset.nf==='name')s1.querySelectorAll('button').forEach((x,k)=>{if(k>0)x.disabled=e.target.value.trim().length<3;});return;}
  if(e.target.dataset?.nft!==undefined){state.nf.team[+e.target.dataset.nft][0]=e.target.value;return;}if(e.target.dataset&&e.target.dataset.tour!==undefined){state.tour=+e.target.value;e.target.nextElementSibling.textContent=e.target.value;return;}if(e.target.id==='palq'){state.palSel=0;drawPalette();return;}if(e.target.id==='stockq'){state.stockQ=e.target.value;const pos=e.target.selectionStart;render();const i=document.getElementById('stockq');i.focus();i.setSelectionRange(pos,pos);}});
document.addEventListener('submit',e=>{if(e.target.id==='askf'){e.preventDefault();const v=document.getElementById('askin').value.trim();if(!v)return;const i=ANSWERS.findIndex(a=>v.toLowerCase().includes(a.q.split(' ')[1].toLowerCase()));ask(i,v);document.getElementById('askin').value='';}});
document.addEventListener('dragstart',e=>{const n=e.target.closest?.('.cprod');if(n){state.dragNew=n.dataset.mgadd;e.dataTransfer.effectAllowed='copy';return;}const c=e.target.closest?.('.pf[draggable="true"]');if(!c)return;state.drag=c.dataset.mgit;c.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
document.addEventListener('dragover',e=>{if(state.dragNew){const tk=e.target.closest?.('.etk');if(tk){e.preventDefault();document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));tk.classList.add('over');}return;}if(state.drag==null)return;const c=e.target.closest?.('.pf[draggable="true"],.etk');if(!c)return;e.preventDefault();document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));c.classList.add('over');});
document.addEventListener('drop',e=>{if(state.dragNew){const tk=e.target.closest?.('.etk');const n=state.dragNew;state.dragNew=null;if(tk){e.preventDefault();mgAdd(n,+tk.dataset.mgfree);render();}return;}if(state.drag==null)return;const c=e.target.closest?.('.pf[draggable="true"],.etk');if(!c)return;e.preventDefault();const M=mgState(),g=M.gonds[M.gi],[a1,a2]=state.drag.split('|').map(Number);state.drag=null;
  if(c.classList.contains('pf')){const [b1,b2]=c.dataset.mgit.split('|').map(Number);const t=g.sh[a1].items[a2];g.sh[a1].items[a2]=g.sh[b1].items[b2];g.sh[b1].items[b2]=t;}
  else{const si=+c.dataset.mgfree;if(si!==a1){const it=g.sh[a1].items.splice(a2,1)[0];g.sh[si].items.push(it);}}
  M.sel=null;render();});
document.addEventListener('dragend',()=>{state.drag=null;state.dragNew=null;document.querySelectorAll('.over,.dragging').forEach(x=>x.classList.remove('over','dragging'));});
document.addEventListener('pointerover',e=>{const h=e.target.closest?.('.hit');const tip=document.getElementById('ctip');if(!tip)return;if(!h){tip.classList.remove('on');return;}const w=tip.parentElement.getBoundingClientRect(),r=h.getBoundingClientRect();tip.textContent=h.dataset.tipc;tip.style.left=(r.left-w.left+r.width/2)+'px';tip.style.top=(r.top-w.top)+'px';tip.classList.add('on');});

(()=>{try{const q=new URLSearchParams(location.search).get('role');if(['sylvain','pharmacien','preparateur'].includes(q)){state.role=q;state.page=q==='sylvain'?'reseau':'aujourdhui';}}catch(e){}})();
render();
</script>
